<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Panda coding at a desk</title>
<desc id="desc">A round, chubby black-and-white giant panda with black ears, eye patches, arms and legs, typing at a laptop.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a2b"/><stop offset="1" stop-color="#24334b"/></linearGradient>
 <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#183b50"/><stop offset="1" stop-color="#0d1929"/></linearGradient>
</defs>
<rect width="900" height="430" rx="26" fill="url(#bg)"/>
<circle cx="735" cy="82" r="42" fill="#3b82a0" opacity=".12"/><circle cx="160" cy="110" r="65" fill="#6db7c8" opacity=".08"/>
<path d="M70 344H830" stroke="#547087" stroke-width="4" stroke-linecap="round"/>
<rect x="90" y="78" width="210" height="122" rx="12" fill="#14273a" stroke="#527187" stroke-width="3"/>
<path d="M108 100h174M108 117h120M108 134h145" stroke="#6c91a8" stroke-width="5" stroke-linecap="round" opacity=".65"/>
<g fill="#9ad6dc"><circle cx="117" cy="160" r="5"/><circle cx="139" cy="160" r="5"/><circle cx="161" cy="160" r="5"/></g>
<rect x="680" y="125" width="105" height="105" rx="10" fill="#1a2d3d" stroke="#527187" stroke-width="3"/>
<path d="M697 150h70M697 168h48M697 186h58" stroke="#7ab7c5" stroke-width="5" stroke-linecap="round"/>
<!-- Sturdy panda body: black limbs frame a broad white belly -->
<g>
 <ellipse cx="450" cy="277" rx="132" ry="91" fill="#202a35"/>
 <ellipse cx="450" cy="274" rx="91" ry="82" fill="#f4f5f2"/>
 <ellipse cx="354" cy="277" rx="37" ry="76" fill="#202a35" transform="rotate(22 354 277)"/>
 <ellipse cx="546" cy="277" rx="37" ry="76" fill="#202a35" transform="rotate(-22 546 277)"/>
 <ellipse cx="388" cy="337" rx="58" ry="31" fill="#202a35"/>
 <ellipse cx="512" cy="337" rx="58" ry="31" fill="#202a35"/>
</g>
<!-- Ears are clearly visible above the round white head -->
<g>
 <circle cx="369" cy="139" r="39" fill="#202a35"/>
 <circle cx="531" cy="139" r="39" fill="#202a35"/>
 <ellipse cx="450" cy="204" rx="111" ry="91" fill="#f4f5f2"/>
 <ellipse cx="408" cy="198" rx="25" ry="34" fill="#202a35" transform="rotate(22 408 198)"/>
 <ellipse cx="492" cy="198" rx="25" ry="34" fill="#202a35" transform="rotate(-22 492 198)"/>
 <ellipse cx="408" cy="198" rx="7" ry="10" fill="#fff"/>
 <ellipse cx="492" cy="198" rx="7" ry="10" fill="#fff"/>
 <ellipse cx="450" cy="231" rx="15" ry="11" fill="#26313a"/>
 <path d="M450 241q-9 13-20 3m20-3q9 13 20 3" fill="none" stroke="#26313a" stroke-width="4" stroke-linecap="round"/>
</g>
<!-- Forearms reach around the laptop -->
<path d="M348 274q-40 3-61 34q-10 15 5 22q29 10 70-24M552 274q40 3 61 34q10 15-5 22q-29 10-70-24" fill="#202a35" stroke="#f4f5f2" stroke-width="5"/>
<g transform="translate(315 265)">
 <path d="M0 0h270l-22 80H22z" fill="#8fa4b4"/><path d="M15 8h240l-16 60H31z" fill="#1b2938"/>
 <rect x="25" y="14" width="220" height="47" rx="5" fill="url(#screen)"/>
 <g stroke="#6fe0c1" stroke-width="4" stroke-linecap="round" opacity=".9"><path d="M43 28h70M43 40h120M43 52h55"/></g>
 <g fill="#f6c76a"><circle cx="226" cy="24" r="3"/><circle cx="226" cy="36" r="3"/></g>
 <path d="M-18 80h306l-24 17H6z" fill="#c1cbd2"/>
</g>
<g fill="#d7e5eb" font-family="monospace"><text x="450" y="390" text-anchor="middle" font-size="17" letter-spacing="4">PANDA DEVELOPER MODE</text></g>
<style>
@keyframes type{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
</style>
</svg>